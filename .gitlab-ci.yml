stages:
  - test
  - build
  - deploy

.pnpm_setup:
  image: node:22-alpine
  variables:
    HUSKY: '0'
  before_script:
    # pnpm 11.1.1 (packageManager) требует Node >= 22.13; на Node 20 падает с node:sqlite
    - npm install -g pnpm@11.1.1
    - pnpm install --frozen-lockfile
  tags:
    - docker

.test_frontend:
  extends: .pnpm_setup
  stage: test
  script:
    - pnpm lint:all
    - pnpm typecheck
    - pnpm test:cov
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - coverage/cobertura-coverage.xml
      - coverage/coverage-summary.json
      - reports/junit.xml
    reports:
      junit: reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    expire_in: 1 week

test frontend develop:
  extends: .test_frontend
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'

test frontend production:
  extends: .test_frontend
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

.build_frontend:
  extends: .pnpm_setup
  stage: build
  variables:
    HUSKY: '0'
    NODE_ENV: production
    NUXT_PUBLIC_API_BASE: https://olimpapi.portalrent.ru/api
  script:
    - pnpm run build
  artifacts:
    paths:
      - .output

build frontend develop:
  extends: .build_frontend
  needs:
    - test frontend develop
  environment:
    name: develop
    url: https://lk-assistant-main.portalrent.ru
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'

build frontend production:
  extends: .build_frontend
  needs:
    - test frontend production
  environment:
    name: production
    url: https://brokerolimp.portalrent.ru
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'

.deploy_frontend:
  stage: deploy
  variables:
    PROJECT_TYPE: nuxt
  script:
    - DEPLOY_DIR=/var/www/${CI_PROJECT_NAME}/${CI_COMMIT_BRANCH}
    - mkdir -p "$(dirname "${DEPLOY_DIR}")"
    - |
      if [ ! -d "${DEPLOY_DIR}/.git" ]; then
        rm -rf "${DEPLOY_DIR}"
        git clone --branch "${CI_COMMIT_BRANCH}" --depth 1 "${CI_REPOSITORY_URL}" "${DEPLOY_DIR}"
      else
        cd "${DEPLOY_DIR}"
        git fetch "${CI_REPOSITORY_URL}" "${CI_COMMIT_BRANCH}"
        git reset --hard FETCH_HEAD
        git clean -fd
      fi
    - rm -rf ${DEPLOY_DIR}/.output
    - cp -rf ${CI_PROJECT_DIR}/.output ${DEPLOY_DIR}/
    - test -f ${DEPLOY_DIR}/.output/public/index.html
    - ~/devdeployer/deploy.sh start
    - |
      # MM notification publish
      curl -s -X POST -H "Content-Type: application/json; charset=utf-8" -H "Authorization: Bearer ${MM_BOT}" \
        -d "{\"channel_id\":\"${MM_GROUP}\",\"message\":\"Загружено [**${CI_PROJECT_NAME} / ${CI_ENVIRONMENT_NAME}**](${CI_ENVIRONMENT_URL})\nВетка: ${CI_COMMIT_BRANCH}\nАвтор: ${CI_COMMIT_AUTHOR}\nПравка: [${CI_COMMIT_TITLE}](${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA})\"}" \
        https://mm.grandfs-develop.ru/api/v4/posts > /dev/null

deploy develop:
  extends: .deploy_frontend
  environment:
    name: develop
    url: https://lk-assistant-main.portalrent.ru
    on_stop: destroy frontend develop
  needs:
    - build frontend develop
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'
  tags:
    - shell
    - grand232

deploy production:
  extends: .deploy_frontend
  environment:
    name: production
    url: https://brokerolimp.portalrent.ru
    on_stop: destroy frontend production
  needs:
    - build frontend production
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
  tags:
    - shell
    - grand232

.destroy_frontend:
  stage: deploy
  script:
    - ~/devdeployer/deploy.sh stop
  when: manual
  tags:
    - shell
    - grand232

destroy frontend develop:
  extends: .destroy_frontend
  environment:
    name: develop
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == 'develop'

destroy frontend production:
  extends: .destroy_frontend
  environment:
    name: production
    action: stop
  rules:
    - if: $CI_COMMIT_BRANCH == 'main'
